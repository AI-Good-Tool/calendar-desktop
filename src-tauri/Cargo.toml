[package]
name = "yun-xiao-li"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yun_xiao_li_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-http = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 设置里关闭"跟随系统时区"时，状态栏按指定 IANA 时区渲染时间
chrono-tz = "0.10"
tauri-plugin-autostart = "2"


[target.'cfg(target_os = "macos")'.dependencies]
# 读写 ControlCenter 的 trackedApplications（macOS 26 状态栏归属诊断/修复）
plist = "1"
# 读取 NSLocale.preferredLanguages（反映"系统设置 → 语言与地区 → 应用程序"里的单独应用语言）
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSLocale", "NSArray", "NSString"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "~2.3.0"
