name: 'Release'

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                      bundles: app,dmg
                    - platform: macos-latest
                      target: x86_64-apple-darwin
                      bundles: app,dmg
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
                      bundles: nsis

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target
                  key: ${{ matrix.target }}

            - name: install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

            - name: install frontend dependencies
              run: npm ci

            - name: test update flow
              run: node --test tests/updateController.test.js

            - name: require updater signing key
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
              run: |
                  if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
                    echo "Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before publishing."
                    exit 1
                  fi

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
                  includeUpdaterJson: true
                  assetNamePattern: yunxiaoli_[version]_[platform]_[arch][setup][ext]
                  tagName: v__VERSION__ # tauri-action replaces this with the app version
                  releaseName: '云小历 v__VERSION__'
                  releaseBody: |
                      云小历 v__VERSION__
                      - 全新云朵日历 Logo 与应用图标。
                      - 新增关于页面，支持检查更新、下载进度与安装后自动重启。
                      - 支持中英文界面、系统时区与第二时区状态栏。
                      - 提供 Apple Silicon / Intel Mac 和 Windows x64 安装包及签名更新文件。
                  releaseDraft: true
                  prerelease: false

    release:
        name: Publish complete release
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - name: publish after all platforms succeed
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  version=$(node -p "require('./src-tauri/tauri.conf.json').version")
                  gh release download "v$version" --pattern latest.json --dir "$RUNNER_TEMP/updater"
                  node - "$RUNNER_TEMP/updater/latest.json" "$version" <<'NODE'
                  const fs = require('fs');
                  const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
                  if (manifest.version.replace(/^v/, '') !== process.argv[3]) throw new Error('Incorrect updater version');
                  for (const target of ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64']) {
                    const entry = manifest.platforms[target];
                    if (!entry?.url?.startsWith('https://') || !entry.signature) throw new Error(`Missing signed update: ${target}`);
                  }
                  NODE
                  gh release edit "v$version" --target "${{ github.sha }}" --draft=false --latest
